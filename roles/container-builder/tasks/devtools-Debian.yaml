---

# Install tools for Debian family systems
- name: Install Build Tools
  apt:
    name:
      - build-essential
      - pkg-config
      - curl
      - tar
      - xz-utils
      - gpg
      - ca-certificates
    state: present
  become: true

- name: Install Libraries for makemkv
  apt:
    name:
      - libc6-dev
      - libssl-dev
      - libexpat1-dev
      - libavcodec-dev
      - libgl1-mesa-dev
      - qtbase5-dev
      - zlib1g-dev
    state: present
  become: true
