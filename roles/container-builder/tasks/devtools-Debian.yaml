---
# Install tools for Debian family systems
- name: Install Build Tools
  apt:
    name:
      - build-essential
      - pkg-config
      - curl
      - tar
      - xz-utils
      - gpg
      - ca-certificates
    state: present
  become: true

- name: Install Libraries for makemkv
  apt:
    name:
      - libc6-dev
      - libssl-dev
      - libexpat1-dev
      - libavcodec-dev
      - libgl1-mesa-dev
      - qtbase5-dev
      - zlib1g-dev
    state: present
  become: true

- name: Install libraries for ffmpeg
  apt:
    name:
      - libass-dev
      - libfreetype6-dev
      - libgnutls28-dev
      - libmp3lame-dev
      - libsdl2-dev
      - libtool
      - libva-dev
      - libvdpau-dev
      - libvorbis-dev
      - libxcb1-dev
      - libxcb-shm0-dev
      - libxcb-xfixes0-dev
      - libx264-dev
      - libx265-dev
      - libnuma-dev
      - libvpx-dev
      - libopus-dev
      - libaom-dev 
      - libfdk-aac-dev
    state: present

