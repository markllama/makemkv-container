---
#
# Install build tools on a Debian or RedHat family system
#
- name: Build MakeMKV CLI
  hosts: localhost
  connection: local

  vars_files:
    - makemkv.yaml

  tasks:
    - name: Unpack MakeMKV Tarballs
      unarchive:
        #    src: "{{ ansible_env.PWD }}/build/tarballs/makemkv-{{ item }}-{{ makemkv.version }}.tar.gz"
        src: "https://www.makemkv.com/download/makemkv-{{ item }}-{{ makemkv.version }}.tar.gz"
        dest: "{{ ansible_env.PWD }}/build/"
        remote_src: true
      loop:
        - oss
        - bin


    # -----------------------------------------------------------------------
    # This block just runs the configure and make commands for the 
    # compiled components of MakeMKV.  This process does not build
    # the GUI parts of MakeMKV so it can run in a container without a display
    # -----------------------------------------------------------------------
    - name: Build Components
      block:
        - name: Configure Source Build
          shell:
            chdir: "{{ ansible_env.PWD }}/build/makemkv-oss-{{ makemkv.version }}"
            cmd: "PKG_CONFIG_PATH={{ ansible_env.PWD }}/build/usr/lib/pkgconfig ./configure --disable-gui"
            creates: "config.log"

        - name: Create space for EULA
          file:
            path: "{{ ansible_env.PWD }}/build/makemkv-{{ item }}-{{ makemkv.version }}/tmp"
            state: directory
          loop:
            - oss
            - bin

        - name: Build MakeMKV linux files
          make:
            chdir: "{{ ansible_env.PWD }}/build/makemkv-oss-{{ makemkv.version }}"
            
        - name: Accept EULA License
          copy:
            dest: "{{ ansible_env.PWD }}/build/makemkv-{{ item }}-{{ makemkv.version }}/tmp/eula_accepted"
            content: |
              accepted
          loop:
            - oss
            - bin

      tags: build

    - name: Create Model
      block:
        - name: Create model directory for container tree
          file:
            path: "{{ ansible_env.PWD }}/build/model"
            state: directory
            recurse: true

        - name: Install built files into model
          make:
            target: install
            params:
              DESTDIR: "{{ ansible_env.PWD }}/build/model"
              PREFIX: "/usr"
            chdir: "{{ ansible_env.PWD }}/build/makemkv-{{ item }}-{{ makemkv.version }}"
          loop:
            - oss
            - bin

        - name: Scan current model contents
          shell:
            cmd: find * -type f
            chdir: "{{ ansible_env.PWD }}/build/model"
          register: model1

        - name: Report current model contents
          debug:
            msg: "{{ model1.stdout_lines }}"

        # - name: Collect shared libraries
        #   shell:
        #     cmd: |
        #       scripts/collect-shared-libraries.sh

        # - name: Scan current model contents
        #   shell:
        #     cmd: find * -type f
        #     chdir: "{{ ansible_env.PWD }}/build/model"
        #   register: model2

        # - name: Report current model contents
        #   debug:
        #     msg: "{{ model2.stdout_lines }}"

      tags: model

