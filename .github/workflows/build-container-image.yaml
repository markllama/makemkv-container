---
name: build-makemkvcon
run-name: Build MakeMKV CLI Software Container
on: [ workflow_dispatch ]

# variables
# makemkv:
#   version: 1.18.4
#   components:
#     - oss
#     - bin

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Update package metadata
        run: |
          sudo apt -y update

      - name: Install build tools
        run: |
          sudo apt -y install \
            build-essential \
            pkg-config

      - name: Install Libraries for makemkvcon
        run: |
          sudo apt -y install \
            build-essential \
            pkg-config \
            libc6-dev \
            libssl-dev \
            libexpat1-dev \
            libavcodec-dev \
            libgl1-mesa-dev \
            qtbase5-dev \
            zlib1g-dev

      - name: Install libraries for ffmpeg
        run: |
          sudo apt -y install \
            yasm \
            nasm \
            curl \
            tar \
            xz-utils \
            gpg \
            ca-certificates \
            libass-dev \
            libfreetype6-dev \
            libgnutls28-dev \
            libmp3lame-dev \
            libsdl2-dev \
            libtool \
            libva-dev \
            libvdpau-dev \
            libvorbis-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libx264-dev \
            libx265-dev \
            libnuma-dev \
            libvpx-dev \
            libopus-dev
            
      - name: Clone ffmpeg repo
        run: git clone --depth=1 --single-branch https://git.ffmpeg.org/ffmpeg.git 

      - name: Configure ffmpeg
        working-directory: ffmpeg
        run: |
          ./configure \
            --prefix=/tmp/ffmpeg \
            --enable-static \
            --disable-shared \
            --enable-pic \
            --enable-libfdk-aac

      - name: Build ffmpeg
        working-directory: ffmpeg
        run: make install
    
